<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbitopia — Junior Astronaut Mission Trainer</title>
  <meta name="description" content="A bilingual (English/French) space-base game for kids 7–12. Balance air, power and shielding against the REAL Sun, using NASA DONKI, OSDR and RadLab data.">
  <meta name="theme-color" content="#120b3a">
  <meta name="generator" content="Hand-written HTML/CSS/JS by Team Orbitopia with AI coding assistance (Claude, Anthropic). See README: Use of SI.">
  <meta name="ai-assistance" content="Code and text drafted with Claude (Anthropic) and reviewed by the team. All illustrations are vector SVG drawn in code (AI-assisted), based on the team mood board. No image generator is used.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="s1"></div><div class="s2"></div></div>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Orbitopia home"><svg viewBox="0 0 48 48" class="brand-ic" aria-hidden="true"><circle cx="24" cy="24" r="13" fill="#f07a45" stroke="#1f2a5a" stroke-width="3"/><ellipse cx="24" cy="25" rx="22" ry="7" fill="none" stroke="#ffd23f" stroke-width="4" transform="rotate(-18 24 24)"/></svg><span class="brand-t">Orbitopia</span></button>
    <div class="top-actions">
      <button class="ask-btn" id="askBtn" aria-label="Ask Nova"></button>
      <div class="lang" role="group" aria-label="Language"><button id="langEn" aria-label="English">EN</button><button id="langFr" aria-label="Français">FR</button></div>
      <button class="icon-btn" id="soundBtn" aria-label="Sound"></button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="askLayer" class="ask-layer" hidden></div>
  <noscript><p style="color:#fff;padding:2rem">Orbitopia needs JavaScript to run.</p></noscript>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/content.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
